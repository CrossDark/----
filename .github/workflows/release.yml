name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  QT_VERSION: 6.7.2

jobs:
  # ---------- PDF 文档(保持不变,仅路径随目录重组更新) ----------
  pdf:
    name: PDF 文档
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Install CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Compile PDF
        run: make -C 文档 all

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-pdf
          path: 文档/dist/地狱之下.pdf
          if-no-files-found: error

  # ---------- 命令行版 worldgen(三平台) ----------
  worldgen-cli:
    name: 命令行版 (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            out: worldgen
            art: worldgen-linux-x86_64
          - name: macOS
            os: macos-latest
            out: worldgen
            art: worldgen-macos-arm64
          - name: Windows
            os: windows-latest
            out: worldgen.exe
            art: worldgen-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install zlib (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev

      - name: Install MinGW + zlib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          $env:PATH = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin;" + $env:PATH
          vcpkg install zlib:x64-mingw-dynamic

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: cc -O3 程序/世界生成器/核心/worldgen.c -lm -lz -o ${{ matrix.out }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin;" + $env:PATH
          gcc -O3 "程序/世界生成器/核心/worldgen.c" `
            -I"C:\vcpkg\installed\x64-mingw-dynamic\include" `
            -L"C:\vcpkg\installed\x64-mingw-dynamic\lib" `
            -lz -lm -o ${{ matrix.out }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.art }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  # ---------- GUI 图形版(三平台) ----------
  worldgen-gui:
    name: GUI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            bin: build-gui/worldgen_gui
          - name: macOS
            os: macos-14
            bin: build-gui/worldgen_gui.app
          - name: Windows
            os: windows-latest
            bin: build-gui/worldgen_gui.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: brew install qt

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --quiet aqtinstall
          python3 -m aqt install-qt linux desktop ${{ env.QT_VERSION }} gcc_64 -O /opt/Qt

      - name: Install Qt + MinGW (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --quiet aqtinstall
          python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_mingw -O C:/Qt
          python -m aqt install-tool windows desktop tools_mingw qt.tools.win64_mingw1120 -O C:/Qt

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zlib1g-dev libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libdbus-1-dev libglib2.0-dev libxcb1-dev libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev

      - name: Install zlib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install zlib:x64-mingw-dynamic

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S 程序/世界生成器/GUI -B build-gui -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S 程序/世界生成器/GUI -B build-gui -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/opt/Qt/${{ env.QT_VERSION }}/gcc_64

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\Qt\Tools\mingw1120_64\bin;" + $env:PATH
          cmake -S 程序/世界生成器/GUI -B build-gui -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:/Qt/${{ env.QT_VERSION }}/mingw_64" -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-mingw-dynamic

      - name: Build (macOS/Linux)
        if: runner.os != 'Windows'
        run: cmake --build build-gui -j3

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\Qt\Tools\mingw1120_64\bin;" + $env:PATH
          cmake --build build-gui -j3

      - name: Package (.dmg, macOS)
        if: runner.os == 'macOS'
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build-gui/worldgen_gui.app -always-overwrite
          hdiutil create -volname "世界生成器" -srcfolder build-gui/worldgen_gui.app -ov -format UDZO 世界生成器_macOS_arm64.dmg

      - name: Package (AppImage, Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export PATH=/opt/Qt/${{ env.QT_VERSION }}/gcc_64/bin:$PATH
          export LD_LIBRARY_PATH=/opt/Qt/${{ env.QT_VERSION }}/gcc_64/lib:$LD_LIBRARY_PATH
          printf '%s\n' '[Desktop Entry]' 'Name=世界生成器' 'Comment=世界地图生成器' 'Exec=worldgen_gui' 'Icon=worldgen_gui' 'Type=Application' 'Categories=Utility;Graphics;' > worldgen_gui.desktop
          convert -size 64x64 xc:'#2c3e50' worldgen_gui.png
          set +e
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run --appdir AppDir \
            --executable build-gui/worldgen_gui \
            --desktop-file worldgen_gui.desktop \
            --icon-file worldgen_gui.png \
            --plugin qt --output appimage
          set -e
          if ls worldgen_gui-*.AppImage >/dev/null 2>&1; then
            mv worldgen_gui-*.AppImage 世界生成器_Linux_x86_64.AppImage
          else
            echo "AppImage 打包失败,退回 tar.gz"
            tar -czf 世界生成器_Linux_x86_64.tar.gz -C build-gui worldgen_gui
          fi

      - name: Package (zip, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\Qt\Tools\mingw1120_64\bin;C:\Qt\${{ env.QT_VERSION }}\mingw_64\bin;" + $env:PATH
          windeployqt --no-translations build-gui/worldgen_gui.exe
          Copy-Item C:\Qt\Tools\mingw1120_64\bin\libgcc_s_seh-1.dll build-gui\
          Copy-Item C:\Qt\Tools\mingw1120_64\bin\libstdc++-6.dll build-gui\
          Copy-Item C:\Qt\Tools\mingw1120_64\bin\libwinpthread-1.dll build-gui\
          Copy-Item C:\vcpkg\installed\x64-mingw-dynamic\bin\zlib1.dll build-gui\
          Compress-Archive -Path build-gui\* -DestinationPath 世界生成器_Windows_x86_64.zip

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: gui-macos-arm64
          path: 世界生成器_macOS_arm64.dmg
          if-no-files-found: error

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: gui-linux
          path: |
            世界生成器_Linux_x86_64.AppImage
            世界生成器_Linux_x86_64.tar.gz
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gui-windows
          path: 世界生成器_Windows_x86_64.zip
          if-no-files-found: error

  # ---------- 汇总发布 ----------
  release:
    name: 发布
    needs: [pdf, worldgen-cli, worldgen-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Delete stale latest release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          gh release delete latest --yes --repo "$GITHUB_REPOSITORY" || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          draft: false
          prerelease: false
          files: |
            artifacts/dist-pdf/地狱之下.pdf
            artifacts/worldgen-linux-x86_64/worldgen
            artifacts/worldgen-macos-arm64/worldgen
            artifacts/worldgen-windows-x86_64/worldgen.exe
            artifacts/gui-linux/世界生成器_Linux_x86_64.AppImage
            artifacts/gui-linux/世界生成器_Linux_x86_64.tar.gz
            artifacts/gui-macos-arm64/世界生成器_macOS_arm64.dmg
            artifacts/gui-windows/世界生成器_Windows_x86_64.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}