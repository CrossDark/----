name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  QT_VERSION: 6.7.2

jobs:
  # ---------- PDF 文档(保持不变) ----------
  pdf:
    name: PDF 文档
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Install CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Compile PDF
        run: make -C 文档 all

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-pdf
          path: 文档/dist/地狱之下.pdf
          if-no-files-found: error

  # ---------- 命令行版 worldgen (三平台,统一 CMake: BUILD_GUI=OFF) ----------
  worldgen-cli:
    name: 命令行版 (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            out: build-cli/worldgen
            art: worldgen-linux-x86_64
          - name: macOS
            os: macos-latest
            out: build-cli/worldgen
            art: worldgen-macos-arm64
          - name: Windows
            os: windows-latest
            out: build-cli/worldgen.exe
            art: worldgen-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install zlib (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev

      - name: Install MinGW + zlib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          $env:PATH = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin;" + $env:PATH
          vcpkg install zlib:x64-mingw-dynamic

      - name: Configure CLI (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S 程序/世界生成器 -B build-cli -DCMAKE_BUILD_TYPE=Release

      - name: Configure CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin;" + $env:PATH
          cmake -S 程序/世界生成器 -B build-cli -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin\gcc.exe" `
            -DZLIB_INCLUDE_DIR="C:\vcpkg\installed\x64-mingw-dynamic\include" `
            -DZLIB_LIBRARY="C:\vcpkg\installed\x64-mingw-dynamic\lib\libz.dll.a"

      - name: Build CLI
        run: cmake --build build-cli -j3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.art }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  # ---------- GUI 图形版(三平台,统一 CMake: BUILD_GUI=ON) ----------
  worldgen-gui:
    name: GUI (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            bin: build-gui/worldgen_gui
          - name: macOS
            os: macos-14
            bin: build-gui/worldgen_gui.app
          - name: Windows
            os: windows-latest
            bin: build-gui/worldgen_gui.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: brew install qt

      # Ubuntu 24.04 自带 Qt 6.4,避免 aqtinstall 解析 Qt 在线仓库失败(qt_base)
      - name: Install Qt (Linux, apt)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq qt6-base-dev

      # 编译器直接用 runner 预装的 Git for Windows mingw64(含 gcc/zlib),
      # 不再依赖 aqtinstall 的 tools_mingw 模块
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --quiet aqtinstall
          python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_mingw -O C:/Qt

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zlib1g-dev libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libdbus-1-dev libglib2.0-dev libxcb1-dev libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev

      - name: Configure GUI (macOS)
        if: runner.os == 'macOS'
        run: cmake -S 程序/世界生成器 -B build-gui -DBUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Configure GUI (Linux)
        if: runner.os == 'Linux'
        run: cmake -S 程序/世界生成器 -B build-gui -DBUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release

      - name: Configure GUI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\Git\mingw64\bin;" + $env:PATH
          cmake -S 程序/世界生成器 -B build-gui -G "MinGW Makefiles" -DBUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="C:\Program Files\Git\mingw64\bin\gcc.exe" `
            -DCMAKE_CXX_COMPILER="C:\Program Files\Git\mingw64\bin\g++.exe" `
            -DCMAKE_PREFIX_PATH="C:/Qt/${{ env.QT_VERSION }}/mingw_64" `
            -DZLIB_INCLUDE_DIR="C:\Program Files\Git\mingw64\include" `
            -DZLIB_LIBRARY="C:\Program Files\Git\mingw64\lib\libz.a"

      - name: Build GUI (macOS/Linux)
        if: runner.os != 'Windows'
        run: cmake --build build-gui -j3

      - name: Build GUI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\Git\mingw64\bin;" + $env:PATH
          cmake --build build-gui -j3

      - name: Package (.dmg, macOS)
        if: runner.os == 'macOS'
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build-gui/worldgen_gui.app -always-overwrite
          hdiutil create -volname "世界生成器" -srcfolder build-gui/worldgen_gui.app -ov -format UDZO 世界生成器_macOS_arm64.dmg

      - name: Package (AppImage, Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export PATH=/usr/lib/qt6/bin:$PATH
          export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
          printf '%s\n' '[Desktop Entry]' 'Name=世界生成器' 'Comment=世界地图生成器' 'Exec=worldgen_gui' 'Icon=worldgen_gui' 'Type=Application' 'Categories=Utility;Graphics;' > worldgen_gui.desktop
          cp 程序/世界生成器/src/gui/images/world-generator-icon.png worldgen_gui.png
          set +e
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run --appdir AppDir \
            --executable build-gui/worldgen_gui \
            --desktop-file worldgen_gui.desktop \
            --icon-file worldgen_gui.png \
            --plugin qt --output appimage
          set -e
          if ls worldgen_gui-*.AppImage >/dev/null 2>&1; then
            mv worldgen_gui-*.AppImage 世界生成器_Linux_x86_64.AppImage
          elif [ -d AppDir ]; then
            echo "AppImage 打包失败,退回 AppDir 压缩包"
            tar -czf 世界生成器_Linux_x86_64.tar.gz AppDir
          else
            echo "AppImage 打包失败,退回原始二进制"
            tar -czf 世界生成器_Linux_x86_64.tar.gz -C build-gui worldgen_gui
          fi

      - name: Package (zip, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\Qt\${{ env.QT_VERSION }}\mingw_64\bin;C:\Program Files\Git\mingw64\bin;" + $env:PATH
          windeployqt --no-translations --no-compiler-runtime build-gui/worldgen_gui.exe
          Copy-Item "C:\Program Files\Git\mingw64\bin\libgcc_s_seh-1.dll" build-gui\
          Copy-Item "C:\Program Files\Git\mingw64\bin\libstdc++-6.dll" build-gui\
          Copy-Item "C:\Program Files\Git\mingw64\bin\libwinpthread-1.dll" build-gui\
          Compress-Archive -Path build-gui\* -DestinationPath 世界生成器_Windows_x86_64.zip

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: gui-macos-arm64
          path: 世界生成器_macOS_arm64.dmg
          if-no-files-found: error

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: gui-linux
          path: |
            世界生成器_Linux_x86_64.AppImage
            世界生成器_Linux_x86_64.tar.gz
          if-no-files-found: error

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gui-windows
          path: 世界生成器_Windows_x86_64.zip
          if-no-files-found: error

  # ---------- 汇总发布 ----------
  release:
    name: 发布
    needs: [pdf, worldgen-cli, worldgen-gui]
    if: ${{ !cancelled() && needs.pdf.result == 'success' && needs.worldgen-cli.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Delete stale latest release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          gh release delete latest --yes --repo "$GITHUB_REPOSITORY" || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          draft: false
          prerelease: false
          files: |
            artifacts/dist-pdf/地狱之下.pdf
            artifacts/worldgen-linux-x86_64/worldgen
            artifacts/worldgen-macos-arm64/worldgen
            artifacts/worldgen-windows-x86_64/worldgen.exe
            artifacts/gui-linux/世界生成器_Linux_x86_64.AppImage
            artifacts/gui-linux/世界生成器_Linux_x86_64.tar.gz
            artifacts/gui-macos-arm64/世界生成器_macOS_arm64.dmg
            artifacts/gui-windows/世界生成器_Windows_x86_64.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
