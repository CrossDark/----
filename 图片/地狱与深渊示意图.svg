<svg viewBox="0 0 720 460" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "WenQuanYi Micro Hei", "PingFang SC", "Microsoft YaHei", sans-serif; text-rendering: geometricPrecision; }
    </style>
    <marker id="arrUp" markerWidth="7" markerHeight="7" refX="3.5" refY="0" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,7 7,7 3.5,0" fill="#78909C"/>
    </marker>
    <marker id="arrDn" markerWidth="7" markerHeight="7" refX="3.5" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 7,0 3.5,7" fill="#78909C"/>
    </marker>
    <marker id="arrR" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 0,7 7,3.5" fill="#78909C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" fill="#263238" font-size="15" font-weight="600" letter-spacing="2">地狱与深渊 · 位置示意图</text>
  <line x1="280" y1="38" x2="440" y2="38" stroke="#CFD8DC" stroke-width="1"/>

  <!-- Contour lines (subtle elevation hints) -->
  <g opacity="0.5">
    <path d="M 90 380 Q 200 250 250 180 Q 290 140 360 130 Q 430 140 470 180 Q 520 250 630 380" fill="none" stroke="#ECEFF1" stroke-width="1"/>
    <path d="M 120 380 Q 210 280 250 220 Q 290 180 360 170 Q 430 180 470 220 Q 510 280 600 380" fill="none" stroke="#ECEFF1" stroke-width="1"/>
    <path d="M 160 380 Q 225 310 255 260 Q 295 220 360 210 Q 425 220 465 260 Q 495 310 560 380" fill="none" stroke="#ECEFF1" stroke-width="1"/>
  </g>

  <!-- Height reference lines -->
  <line x1="55" y1="110" x2="665" y2="110" stroke="#E53935" stroke-dasharray="2,5" stroke-width="1" opacity="0.3"/>
  <line x1="55" y1="148" x2="665" y2="148" stroke="#1976D2" stroke-dasharray="2,5" stroke-width="1" opacity="0.3"/>

  <!-- Mountain cross-section -->
  <path d="M 50 380 L 250 110 L 288 148 L 432 148 L 470 110 L 670 380 Z"
        fill="#ECEFF1" stroke="#37474F" stroke-width="2" stroke-linejoin="round"/>

  <!-- Volcano interior texture (magma channels) -->
  <g opacity="0.18">
    <path d="M 308 178 L 300 260" fill="none" stroke="#FF7043" stroke-width="1.2" stroke-dasharray="2,3"/>
    <path d="M 340 178 L 335 300" fill="none" stroke="#FF7043" stroke-width="1.2" stroke-dasharray="2,3"/>
    <path d="M 380 178 L 385 270" fill="none" stroke="#FF7043" stroke-width="1.2" stroke-dasharray="2,3"/>
    <path d="M 412 178 L 420 285" fill="none" stroke="#FF7043" stroke-width="1.2" stroke-dasharray="2,3"/>
  </g>

  <!-- Magma reservoir (bottom) -->
  <path d="M 300 330 Q 360 310 420 330" fill="none" stroke="#FF7043" stroke-width="2" opacity="0.2"/>
  <path d="M 310 340 Q 360 322 410 340" fill="none" stroke="#FF7043" stroke-width="1.5" opacity="0.15"/>

  <!-- Crater lake (深渊) -->
  <path d="M 288 148 L 432 148 L 415 180 L 305 180 Z"
        fill="#42A5F5" opacity="0.3" stroke="#1565C0" stroke-width="1.5"/>
  <!-- Water surface -->
  <line x1="288" y1="148" x2="432" y2="148" stroke="#1565C0" stroke-width="2.5"/>
  <!-- Water ripples -->
  <path d="M 310 163 Q 320 159 330 163 T 350 163 T 370 163 T 390 163 T 410 163" fill="none" stroke="#1565C0" stroke-width="0.8" opacity="0.4"/>
  <path d="M 320 172 Q 330 169 340 172 T 360 172 T 380 172 T 400 172" fill="none" stroke="#1565C0" stroke-width="0.6" opacity="0.3"/>

  <!-- 地狱 markers -->
  <circle cx="250" cy="110" r="5.5" fill="#E53935" stroke="#fff" stroke-width="1.5"/>
  <circle cx="470" cy="110" r="5.5" fill="#E53935" stroke="#fff" stroke-width="1.5"/>

  <!-- 地狱 label with pill background -->
  <line x1="250" y1="110" x2="175" y2="68" stroke="#E53935" stroke-width="1" opacity="0.4"/>
  <rect x="68" y="48" width="100" height="38" rx="6" fill="#FFF" stroke="#E53935" stroke-width="1.2"/>
  <text x="118" y="66" text-anchor="middle" fill="#C62828" font-size="14" font-weight="700">地狱</text>
  <text x="118" y="80" text-anchor="middle" fill="#90A4AE" font-size="10">山之最顶峰</text>

  <!-- 深渊 label with pill background -->
  <line x1="360" y1="148" x2="545" y2="68" stroke="#1565C0" stroke-width="1" opacity="0.4"/>
  <rect x="552" y="48" width="100" height="38" rx="6" fill="#FFF" stroke="#1565C0" stroke-width="1.2"/>
  <text x="602" y="66" text-anchor="middle" fill="#0D47A1" font-size="14" font-weight="700">深渊</text>
  <text x="602" y="80" text-anchor="middle" fill="#90A4AE" font-size="10">火山口湖</text>

  <!-- Height difference indicator -->
  <line x1="635" y1="113" x2="635" y2="145" stroke="#78909C" stroke-width="1.5" marker-start="url(#arrUp)" marker-end="url(#arrDn)"/>
  <text x="645" y="133" fill="#78909C" font-size="10">略低</text>

  <!-- Ground line -->
  <line x1="30" y1="380" x2="690" y2="380" stroke="#B0BEC5" stroke-width="1.5"/>

  <!-- Ground texture (subtle ticks) -->
  <g stroke="#CFD8DC" stroke-width="0.8">
    <line x1="80" y1="380" x2="75" y2="386"/>
    <line x1="120" y1="380" x2="115" y2="386"/>
    <line x1="160" y1="380" x2="155" y2="386"/>
    <line x1="560" y1="380" x2="555" y2="386"/>
    <line x1="600" y1="380" x2="595" y2="386"/>
    <line x1="640" y1="380" x2="635" y2="386"/>
  </g>

  <!-- Height annotation (left side) -->
  <line x1="40" y1="380" x2="40" y2="110" stroke="#B0BEC5" stroke-width="0.8" stroke-dasharray="2,3"/>
  <line x1="35" y1="380" x2="45" y2="380" stroke="#78909C" stroke-width="1"/>
  <line x1="35" y1="110" x2="45" y2="110" stroke="#78909C" stroke-width="1"/>
  <text x="28" y="248" text-anchor="middle" fill="#78909C" font-size="11" transform="rotate(-90, 28, 248)">≈ 10,000 m</text>

  <!-- Mountain label -->
  <text x="360" y="402" text-anchor="middle" fill="#37474F" font-size="13" font-weight="500">万米高峰（火山）</text>

  <!-- Magma channel annotation -->
  <text x="360" y="200" text-anchor="middle" fill="#FF7043" font-size="10" opacity="0.5">↑ 岩浆通道</text>

  <!-- Compass (top-right corner) -->
  <g transform="translate(665, 410)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#CFD8DC" stroke-width="1"/>
    <polygon points="0,-10 3,0 0,8 -3,0" fill="#E53935"/>
    <polygon points="0,-10 3,0 -3,0" fill="#C62828"/>
    <text x="0" y="-16" text-anchor="middle" fill="#90A4AE" font-size="9">N</text>
  </g>

  <!-- Legend -->
  <g transform="translate(55, 415)">
    <circle cx="6" cy="0" r="4" fill="#E53935" stroke="#fff" stroke-width="1"/>
    <text x="16" y="3" fill="#546E7A" font-size="10">地狱</text>
    <rect x="50" y="-4" width="12" height="8" fill="#42A5F5" opacity="0.3" stroke="#1565C0" stroke-width="1"/>
    <text x="68" y="3" fill="#546E7A" font-size="10">深渊</text>
    <line x1="105" y1="0" x2="125" y2="0" stroke="#FF7043" stroke-width="1.2" stroke-dasharray="2,3" opacity="0.5"/>
    <text x="131" y="3" fill="#546E7A" font-size="10">岩浆通道</text>
  </g>
</svg>
